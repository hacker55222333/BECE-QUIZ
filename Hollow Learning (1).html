<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hollow Learning</title>
<meta name="theme-color" content="#0b1437">
<style>
:root{--b:#2f6bff;--d:#8fb0ff;--l:#16295a;--r:#e63946;--c:#0f1b3d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#10215a,#070d1f 60%) fixed;color:#f4f7ff;min-height:100vh}
header{position:relative;background:linear-gradient(135deg,#0b1437,#1d3fb8 58%,#c62839);color:#fff;padding:22px 16px 26px;text-align:center;border-radius:0 0 26px 26px;box-shadow:0 6px 24px rgba(230,57,70,.25)}
header h1{margin:0;font-size:1.5rem;letter-spacing:.5px}header p{margin:6px 0 0;opacity:.9}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid #1f3a85;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 14px rgba(0,0,0,.4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px;color:inherit}
.sub{background:var(--l);color:#fff;font-weight:600;border:2px solid transparent;text-align:left}.sub:hover{border-color:var(--r)}
.pri{background:linear-gradient(135deg,var(--b),var(--r));color:#fff;font-weight:600;width:100%;margin-top:8px}
.lv{background:transparent;color:var(--d);border:2px solid var(--b);width:100%}.lv.on{background:var(--b);color:#fff}
.opt{display:block;width:100%;text-align:left;background:var(--l);color:#fff;margin:7px 0}.opt:hover{background:#1f3a85}
.ok{background:#1f7a3d!important}.no{background:#b3262f!important}
.bar{height:8px;background:#1f3a85;border-radius:5px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:linear-gradient(90deg,var(--b),var(--r));width:0;transition:width .3s}
.m{color:#9fb3e8;font-size:.9rem}.hid{display:none}.anon #side,.anon #menu{display:none!important}.anon{padding-left:0!important}
.ex{margin-top:8px;padding:8px;background:#1b2d63;border-left:4px solid var(--r);border-radius:8px;font-size:.9rem}
.big{font-size:2rem;text-align:center;font-weight:700;color:#fff}
input{font:inherit;padding:10px;border:2px solid #2a4a9a;background:#0b1437;color:#fff;border-radius:10px;width:100%}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{height:70px;background:var(--b);color:var(--b);font-weight:600;font-size:.9rem}.mc.up{background:var(--l);color:#fff}.mc.done{background:#1f7a3d;color:#fff}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;color:var(--d)}details p{margin:6px 0 0;line-height:1.5}
#menu{position:absolute;left:12px;top:16px;background:rgba(255,255,255,.2);color:#fff;font-size:1.3rem;padding:6px 12px}
#side{position:fixed;top:0;left:0;bottom:0;width:230px;background:#0b1437;border-right:2px solid var(--r);box-shadow:2px 0 14px rgba(0,0,0,.5);transform:translateX(-100%);transition:.25s;z-index:20;padding:16px}
#side.open{transform:none}#side h3{color:#fff;margin:4px 0 12px}
#side button{display:block;width:100%;text-align:left;background:var(--l);color:#fff;font-weight:600;margin:8px 0}
@media(min-width:800px){#side{transform:none}body{padding-left:230px}#menu{display:none}}
</style></head><body>

()=>{const x=rnd(-8,8),a=rnd(2,9),b=rnd(1,20);return{q:`Solve: ${a}x − ${b} = ${a*x-b}. x = ?`,c:x,e:`${a}x = ${a*x}, so x = ${x}`}}];

function start(n){sub=n;const d=D[n],N=NQ[level];
 qs=d==="gen"?Array.from({length:N},mathQ):(()=>{const t=x=>x[4]=="b"?"i":x[4],mine=shuffle(d.filter(x=>t(x)==level)),low=shuffle(d.filter(x=>RK[t(x)]<RK[level]));let f=[...mine,...low].slice(0,N);if(!f.length)f=shuffle(d).slice(0,N);return f.map(x=>({q:x[0],o:x[1],a:x[2],e:x[3]}))})();
 i=0;sc=0;show("quiz");ask()}

 $("pg").style.width=i/qs.length*100+"%";$("qt").textContent=q.q;$("ex").classList.add("hid");$("nx").classList.add("hid");$("op").innerHTML="";
 q.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent="ABCD"[k]+". "+t;b.onclick=()=>pickAns(k,b);$("op").appendChild(b)})}

 if(q.e){$("ex").textContent="💡 "+q.e;$("ex").classList.remove("hid")}$("nx").textContent=i==qs.length-1?"See result":"Next";$("nx").classList.remove("hid")}

function fin(){const p=Math.round(sc/qs.length*100);pts+=sc;try{localStorage.setItem("pts",pts)}catch{}save(sub+" ("+(LN[level])+")",p);
 $("fs").textContent=`${sc}/${qs.length} (${p}%)`;$("fm").textContent=p>=80?"Excellent! 🎉":p>=50?"Good, keep going! 💪":"Keep practising, you will get it! 📖";show("result")}

 shuffle(PAIRS.flatMap((p,k)=>[{t:p[0],k},{t:p[1],k}])).forEach(c=>{const b=document.createElement("button");b.className="mc";b.textContent="?";

   if(open.length==2){moves++;$("mvs").textContent="Moves: "+moves;const[x,y]=open;

 const[w,h]=wsg.q[wsg.n];wsg.cur=w;$("scIn").disabled=false;$("scIn").value="";$("scW").textContent=scrambled(w).split("").join(" ");$("scH").textContent="Hint: "+h;$("scI").textContent=`Word ${wsg.n+1}/10 • Score ${wsg.s}`;$("scIn").focus()}
