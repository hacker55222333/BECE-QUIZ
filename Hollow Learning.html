<meta name="theme-color" content="#1565c0">
<style>
:root{--b:#1565c0;--d:#0d47a1;--l:#e3f0ff;--t:#12263f}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f4f8ff;color:var(--t)}
header{background:linear-gradient(135deg,var(--d),var(--b));color:#fff;padding:22px 16px 26px;text-align:center;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:1.5rem}header p{margin:6px 0 0;opacity:.9}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(21,101,192,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px}
.sub{background:var(--l);color:var(--d);font-weight:600;border:2px solid transparent;text-align:left}
.sub:hover{border-color:var(--b)}
.pri{background:var(--b);color:#fff;font-weight:600;width:100%;margin-top:8px}
.lv{background:#fff;color:var(--b);border:2px solid var(--b);width:49%}.lv.on{background:var(--b);color:#fff}
.opt{display:block;width:100%;text-align:left;background:var(--l);margin:7px 0}.opt:hover{background:#cfe3fb}
.ok{background:#c8e6c9!important}.no{background:#ffcdd2!important}
.bar{height:8px;background:#dbe7f7;border-radius:5px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:var(--b);width:0;transition:width .3s}
.m{color:#5a6b82;font-size:.9rem}.hid{display:none}.anon #side,.anon #menu{display:none!important}.anon{padding-left:0!important}
header{position:relative}#menu{position:absolute;left:12px;top:16px;background:rgba(255,255,255,.2);color:#fff;font-size:1.3rem;padding:6px 12px}
#side{position:fixed;top:0;left:0;bottom:0;width:230px;background:#fff;box-shadow:2px 0 14px rgba(0,0,0,.25);transform:translateX(-100%);transition:.25s;z-index:20;padding:16px}
#side.open{transform:none}#side h3{color:var(--d);margin:4px 0 12px}
#side button{display:block;width:100%;text-align:left;background:var(--l);color:var(--d);font-weight:600;margin:8px 0}
@media(min-width:800px){#side{transform:none}body{padding-left:230px}#menu{display:none}}details{margin:8px 0}summary{cursor:pointer;font-weight:600;color:var(--d)}details p{margin:6px 0 0;line-height:1.5}
.ex{margin-top:8px;padding:8px;background:#fff8e1;border-radius:8px;font-size:.9rem}
.big{font-size:2rem;text-align:center;font-weight:700;color:var(--b)}
input{font:inherit;padding:10px;border:2px solid #b8d2f2;border-radius:10px;width:100%}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{height:70px;background:var(--b);color:var(--b);font-weight:600;font-size:.9rem}.mc.up{background:var(--l);color:var(--d)}.mc.done{background:#c8e6c9;color:#1b5e20}

<section id="learn" class="hid"><div id="ln"></div><button class="pri" id="lh" style="background:#455a75">Home</button></section>
<section id="chat" class="hid"><div class="card"><div class="m"><span id="rc"></span> <button class="chg" style="padding:4px 8px">change</button></div>

<input id="cap" placeholder="Caption (optional)" style="margin:8px 0"><input id="sp" type="file" accept="image/*"><p class="m">Stories disappear after 24 hours.</p></div><div id="slist"></div></section>
