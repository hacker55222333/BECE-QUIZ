<style>
:root{--b:#2f6bff;--d:#8fb0ff;--l:#16295a;--r:#e63946;--c:#0f1b3d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#10215a,#070d1f 60%) fixed;color:#f4f7ff;min-height:100vh}
header{position:relative;background:linear-gradient(135deg,#0b1437,#1d3fb8 58%,#c62839);color:#fff;padding:22px 16px 26px;text-align:center;border-radius:0 0 26px 26px;box-shadow:0 6px 24px rgba(230,57,70,.25)}
header h1{margin:0;font-size:1.5rem;letter-spacing:.5px}header p{margin:6px 0 0;opacity:.9}
main{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid #1f3a85;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 14px rgba(0,0,0,.4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px;color:inherit}
.sub{background:var(--l);color:#fff;font-weight:600;border:2px solid transparent;text-align:left}.sub:hover{border-color:var(--r)}
.pri{background:linear-gradient(135deg,var(--b),var(--r));color:#fff;font-weight:600;width:100%;margin-top:8px}
.lv{background:transparent;color:var(--d);border:2px solid var(--b);width:100%}.lv.on{background:var(--b);color:#fff}
.opt{display:block;width:100%;text-align:left;background:var(--l);color:#fff;margin:7px 0}.opt:hover{background:#1f3a85}
.ok{background:#1f7a3d!important}.no{background:#b3262f!important}
.bar{height:8px;background:#1f3a85;border-radius:5px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:linear-gradient(90deg,var(--b),var(--r));width:0;transition:width .3s}
.m{color:#9fb3e8;font-size:.9rem}.hid{display:none}.anon #side,.anon #menu{display:none!important}.anon{padding-left:0!important}
.ex{margin-top:8px;padding:8px;background:#1b2d63;border-left:4px solid var(--r);border-radius:8px;font-size:.9rem}
.big{font-size:2rem;text-align:center;font-weight:700;color:#fff}
input{font:inherit;padding:10px;border:2px solid #2a4a9a;background:#0b1437;color:#fff;border-radius:10px;width:100%}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{height:70px;background:var(--b);color:var(--b);font-weight:600;font-size:.9rem}.mc.up{background:var(--l);color:#fff}.mc.done{background:#1f7a3d;color:#fff}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;color:var(--d)}details p{margin:6px 0 0;line-height:1.5}
#menu{position:absolute;left:12px;top:16px;background:rgba(255,255,255,.2);color:#fff;font-size:1.3rem;padding:6px 12px}
#side{position:fixed;top:0;left:0;bottom:0;width:230px;background:#0b1437;border-right:2px solid var(--r);box-shadow:2px 0 14px rgba(0,0,0,.5);transform:translateX(-100%);transition:.25s;z-index:20;padding:16px}
#side.open{transform:none}#side h3{color:#fff;margin:4px 0 12px}
#side button{display:block;width:100%;text-align:left;background:var(--l);color:#fff;font-weight:600;margin:8px 0}
@media(min-width:800px){#side{transform:none}body{padding-left:230px}#menu{display:none}}

["'The sun rose slowly.' 'slowly' is a...",["noun","adjective","adverb","pronoun"],2,"It tells how the sun rose.","b"],

"🔢 Mathematics":"gen",

["The unit of force is the...",["Joule","Newton","Watt","Metre"],1,"Force is measured in newtons.","s"],
["Which organ pumps blood?",["Lungs","Heart","Liver","Kidney"],1,"The heart pumps blood round the body.","s"],
["Water changing to vapour is called...",["Condensation","Evaporation","Freezing","Melting"],1,"Heat turns liquid water into vapour.","b"],
["Which part of the cell controls its activities?",["Cell wall","Nucleus","Vacuole","Cytoplasm"],1,"The nucleus is the control centre.","b"]],

["The longest river in Ghana is the...",["Pra","Ankobra","Volta","Tano"],2,"The Volta.","s"],
["First President of Ghana?",["J.J. Rawlings","Kwame Nkrumah","J.A. Kufuor","Hilla Limann"],1,"Dr Kwame Nkrumah.","s"],

["Which is a rite of passage?",["Naming ceremony","Shopping","Football","Reading"],0,"Rites mark stages of life.","b"]],
"💻 ICT":[

["CPU stands for...",["Central Processing Unit","Computer Power Unit","Central Program Utility","Control Print Unit"],0,"The brain of the computer.","s"],
["Which is an operating system?",["Windows","Excel","Chrome","Word"],0,"Windows runs the computer.","b"],
["1 byte equals how many bits?",["4","8","16","10"],1,"8 bits = 1 byte.","b"]],

["'Merci' means...",["Please","Sorry","Thank you","Goodbye"],2,"Merci = thank you.","s"],
["'Chat' means...",["dog","cat","bird","fish"],1,"Chat = cat.","s"],

["'Ɔbarima' means...",["Woman","Man","Child","Elder"],1,"ɔbarima = man, ɔbaa = woman.","b"]],

["A workshop safety rule is to...",["Run around","Wear protective clothing","Eat while working","Skip instructions"],1,"Stay safe.","b"]],

["Which is a primary colour?",["Green","Orange","Red","Purple"],2,"Red, blue, yellow.","s"],
["Blue + yellow makes...",["Green","Orange","Purple","Brown"],0,"Secondary colour green.","b"]],
"✝️ Bible Quiz":[
["Who built the ark?",["Moses","Noah","Abraham","David"],1,"Genesis 6.","s"],
["How many disciples did Jesus choose?",["10","11","12","14"],2,"Twelve.","s"],
["Who was swallowed by a big fish?",["Jonah","Peter","Elijah","Paul"],0,"Jonah.","s"],

["The Sermon on the Mount is in...",["Matthew 5–7","John 3","Acts 2","Genesis 1"],0,"Matthew 5–7.","b"],
["Who replaced Judas as an apostle?",["Matthias","Barnabas","Silas","Timothy"],0,"Acts 1.","b"]]
};
if(window.EXTRA)for(const k in EXTRA)if(Array.isArray(D[k]))D[k].push(...EXTRA[k]);
const FACTS=["Ghana was the first sub-Saharan African country to gain independence (1957).","7 × 7 = 49, so 49 is a square number.","Lake Volta is one of the largest man-made lakes in the world.","A square number is a number multiplied by itself, like 6 × 6 = 36.","The Bible has 66 books: 39 in the Old Testament, 27 in the New.","Negative × negative = positive.","Water boils at 100°C at sea level.","'Bonjour' is the French word for hello."];
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let user=localStorage.getItem("user")||"",level="s",T,qs,i,sc,lock,sub,sp;
/* ---- maths generators ---- */
const W1="zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen".split(" "),TY=",,twenty,thirty,forty,fifty,sixty,seventy,eighty,ninety".split(",");
function words(n){if(n<20)return W1[n];if(n<100)return TY[n/10|0]+(n%10?"-"+W1[n%10]:"");
 if(n<1000)return W1[n/100|0]+" hundred"+(n%100?" and "+words(n%100):"");
 return words(n/1000|0)+" thousand"+(n%1000?(n%1000<100?" and ":" ")+words(n%1000):"")}
const NUM={s:[()=>{const n=rnd(2,12);return{q:`${n}² = ?`,c:n*n,e:`${n} × ${n} = ${n*n}`}},
 ()=>{const n=rnd(2,12);return{q:`√${n*n} = ?`,c:n,e:`${n} × ${n} = ${n*n}`}},
 ()=>{const a=rnd(-9,9),b=rnd(-9,9),p=rnd(0,1);return{q:`(${a}) ${p?"+":"−"} (${b}) = ?`,c:p?a+b:a-b,e:p?"Add the integers.":"Subtracting a negative means adding."}}],
 b:[()=>{const p=pick([10,15,20,25,30,40]),n=pick([40,60,80,120,200,300,400]);return{q:`${p}% of ${n} = ?`,c:p*n/100,e:`${p}/100 × ${n}`}},
 ()=>{const x=rnd(2,12),a=rnd(2,9),b=rnd(1,20);return{q:`Solve: ${a}x + ${b} = ${a*x+b}. x = ?`,c:x,e:`${a}x = ${a*x}, so x = ${x}`}},
 ()=>{const l=rnd(4,15),w=rnd(3,12);return{q:`Area of a rectangle ${l} cm by ${w} cm (cm²)?`,c:l*w,e:"Area = length × width."}},
 ()=>{const a=rnd(2,9),b=rnd(2,9);return{q:`(−${a}) × (−${b}) = ?`,c:a*b,e:"Negative × negative = positive."}},
 ()=>{const n=rnd(13,25);return{q:`${n}² = ?`,c:n*n,e:`${n} × ${n} = ${n*n}`}}]};
const WRD={s:[()=>{const n=rnd(11,999);return{q:`Write ${n} in words.`,c:words(n),e:"Break it into hundreds, tens and units.",wr:()=>words(Math.max(1,n+rnd(-30,30)))}},
 ()=>{const n=rnd(11,999);return{q:`Which number is "${words(n)}"?`,c:n,e:`${words(n)} = ${n}`,wr:()=>Math.max(1,n+rnd(-30,30))}}],
 b:[()=>{const n=rnd(1000,9999);return{q:`Write ${n} in words.`,c:words(n),e:"Thousands, hundreds, tens, units.",wr:()=>words(Math.max(1,n+rnd(-300,300)))}}]};
NUM.i=NUM.b;WRD.i=WRD.b;
NUM.l=[()=>{const n=rnd(2,9);return{q:`${n}³ = ?`,c:n**3,e:`${n} × ${n} × ${n} = ${n**3}`}},
()=>{const a=rnd(2,20),b=rnd(2,9),c=rnd(2,9),d=rnd(1,15);return{q:`${a} + ${b} × ${c} − ${d} = ?`,c:a+b*c-d,e:"Multiply first (BODMAS), then add and subtract."}},
()=>{const p=pick([5,10,15,20,25]),n=pick([40,80,120,200,400]);return{q:`A price of GH₵${n} goes up by ${p}%. New price (GH₵)?`,c:n+n*p/100,e:`${p}% of ${n} = ${n*p/100}; add it to ${n}.`}},

()=>{const x=rnd(-8,8),a=rnd(2,9),b=rnd(1,20);return{q:`Solve: ${a}x − ${b} = ${a*x-b}. x = ?`,c:x,e:`${a}x = ${a*x}, so x = ${x}`}}];

 const a=shuffle([...s]);return{q:x.q,o:a.map(String),a:a.indexOf(x.c),e:x.e}}
